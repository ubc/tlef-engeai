<!-- SETTINGS COMPONENT — course capability toggles -->
<link rel="stylesheet" href="/styles/instructor-components/settings.css">

<div class="settings-content-area">
    <div class="mobile-header-bar">
        <button id="instructor-hamburger-btn" class="instructor-mobile-hamburger-btn icon-btn" title="Open menu" aria-label="Open menu">
            <i data-feather="menu"></i>
        </button>
        <span class="mobile-header-title">Settings</span>
    </div>
    <div class="settings-content">
        <div class="settings-content-inner">
            <div class="settings-main-content">
                <div class="settings-header">
                    <h1>Settings</h1>
                    <p class="settings-description">
                        Enable or disable optional course capabilities. Disabled features are hidden from the sidebar and dashboard.
                    </p>
                </div>

                <fieldset class="form-group settings-features">
                    <legend>Course Features</legend>

                    <label class="settings-feature-row" for="settingsWritingFeedback">
                        <input type="checkbox" id="settingsWritingFeedback">
                        <span class="settings-feature-copy">
                            <strong>Writing Feedback</strong>
                            <span>Instructors and TAs can import writing, review AI-assisted feedback, approve it, and prepare a Canvas release.</span>
                        </span>
                    </label>

                    <label class="settings-feature-row" for="settingsMemoryAgent">
                        <input type="checkbox" id="settingsMemoryAgent">
                        <span class="settings-feature-copy">
                            <strong>Memory Agent</strong>
                            <span>Detects student struggle topics in Socratic chat and uses instructor-defined struggle catalogs in Documents.</span>
                        </span>
                    </label>

                    <label class="settings-feature-row" for="settingsGuidedPathway">
                        <input type="checkbox" id="settingsGuidedPathway">
                        <span class="settings-feature-copy">
                            <strong>Guided Pathway</strong>
                            <span>Enables the Pathway Library and guided pathway intercepts in chat.</span>
                        </span>
                    </label>

                    <button class="nav-btn btn-next" id="saveCourseFeatures" type="button">Save feature settings</button>
                    <p id="settingsFeatureStatus" role="status" aria-live="polite"></p>
                </fieldset>
            </div>
        </div>
    </div>

    <div class="settings-navigation">
        <button class="nav-btn btn-back" id="settings-back-btn">
            <i data-feather="chevron-left" class="feather"></i>
            <span class="nav-btn-text">Back</span>
        </button>
    </div>
</div>
