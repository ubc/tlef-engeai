<!DOCTYPE html>
<!--
  assignment-page-harness.html — one assignment's page, on synthetic data.

  Runs the real `openAssignmentPage` against a stubbed `fetch`, so the page's own layout
  (the title paired with its right-hand actions, the batch bar above the submission card,
  the row states) can be driven at any width without a database, a login, or a Canvas
  import. Not served by the app and not part of any build; it exists so the browser pass
  for a change to this page is repeatable.

  Mutations are not stubbed: every button here either re-renders the page or fails, which
  is enough for a layout pass and keeps the harness from pretending to be the app.

  @author: EngE-AI Team
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assignment page harness</title>
<link rel="stylesheet" href="../../../styles/style.css">
<!-- Declares the instructor palette (--chat-bg, --background-2, --border-color …) the
     feature stylesheet reads; without it every screenshot shows fallback colours. -->
<link rel="stylesheet" href="../../../styles/instructor-mode.css">
<link rel="stylesheet" href="../../../styles/instructor-components/writing-feedback.css">
</head>
<body>
<!-- The component shell, as instructor-mode loads it. --chat-bg and the rest of the
     palette are declared on .wf-page, so rendering on a bare body would make every
     screenshot lie. -->
<div class="wf-page page-frame">
  <main class="wf-main-content page-shell page-shell--wide">
    <header id="wf-header" class="wf-header page-header mobile-header-bar">
      <div class="wf-header-left"><h1 class="mobile-header-title">Writing Feedback</h1></div>
      <div id="wf-header-actions" class="wf-header-actions">
        <button id="wf-import-canvas" class="wf-header-btn" type="button">
          <i data-feather="download-cloud" aria-hidden="true"></i><span>Import assignment from Canvas</span>
        </button>
        <button id="wf-add-assignment" class="wf-header-btn" type="button" hidden></button>
      </div>
    </header>
    <div id="wf-workspace-message" class="wf-workspace-message" role="status" aria-live="polite" data-tone="info" hidden>
      <span id="wf-workspace-message-text"></span>
      <button id="wf-workspace-message-dismiss" type="button" aria-label="Dismiss this message"></button>
    </div>
    <div id="wf-view-landing" hidden>
      <div id="wf-landing-action-mount"></div>
      <div id="wf-assignment-list" class="wf-assignment-list"></div>
    </div>
    <div id="wf-view-assignment" hidden></div>
    <div id="wf-view-rubric" hidden></div>
    <div id="wf-view-review" hidden></div>
    <div id="wf-action-panel-home">
      <section id="wf-action-panel" class="wf-action-panel" aria-labelledby="wf-action-panel-title" hidden>
        <header class="wf-action-panel-header">
          <h2 id="wf-action-panel-title">Action</h2>
          <button id="wf-action-panel-close" class="wf-icon-button" type="button" aria-label="Close setup panel">
            <i data-feather="x" aria-hidden="true"></i>
          </button>
        </header>
        <div id="wf-action-panel-content"></div>
      </section>
    </div>
  </main>
</div>
<script src="../../../vendor/feather/feather.min.js"></script>
<script type="module">
import { state } from '../../../dist/public/scripts/feature/writing-feedback-shared.js';
import { openAssignmentPage } from '../../../dist/public/scripts/feature/writing-feedback-assignment-page.js';

const ASSIGNMENT = {
    id: 'a1',
    title: 'Lab 3 — Heat Exchanger Performance Report',
    canvasAssignmentId: '9911',
    isLabReport: true,
    createdAt: '2026-09-02T17:00:00.000Z',
    dueAt: '2026-09-15T06:59:00.000Z',
    submissionCount: 6
};

// One row per state the list has to draw: the plain case, a late arrival, a generating row
// (which also puts the batch bar into its progress form), a file awaiting a staff check, a
// failure, and a resubmission notice.
const SUBMISSIONS = [
    { id: 's1', assignmentId: 'a1', studentLabel: 'Avery Chen', attempt: 1, status: 'draft_ready', submittedAt: '2026-09-14T22:10:00.000Z' },
    { id: 's2', assignmentId: 'a1', studentLabel: 'Bakari Osei', attempt: 2, status: 'approved', submittedAt: '2026-09-16T04:40:00.000Z' },
    { id: 's3', assignmentId: 'a1', studentLabel: 'Chiara Rossi', attempt: 1, status: 'generating', submittedAt: '2026-09-15T05:55:00.000Z' },
    { id: 's4', assignmentId: 'a1', studentLabel: 'Devon Park', attempt: 1, status: 'verification_needed', submittedAt: '2026-09-15T03:20:00.000Z', requiresVerification: true },
    { id: 's5', assignmentId: 'a1', studentLabel: 'Esi Mensah', attempt: 1, status: 'failed', submittedAt: '2026-09-15T06:05:00.000Z' },
    { id: 's6', assignmentId: 'a1', studentLabel: 'Farid Haddad', attempt: 1, status: 'released', submittedAt: '2026-09-13T18:00:00.000Z',
      pendingReplacement: { submittedAt: '2026-09-16T01:00:00.000Z', attempt: 2 } }
];

const envelope = (data) => new Response(JSON.stringify({ success: true, data }), {
    status: 200, headers: { 'content-type': 'application/json' }
});

// ?idle=1 settles every run, which is the only way to see the resting state: the header's
// "Generate feedback for all submissions" action, and no progress strip above the list.
const idle = new URL(window.location.href).searchParams.get('idle') === '1';
const submissions = idle
    ? SUBMISSIONS.map((item) => (item.status === 'generating' ? { ...item, status: 'imported' } : item))
    : SUBMISSIONS;

window.fetch = async (url) => {
    const path = String(url);
    if (path.includes('/submissions?assignmentId=')) return envelope(submissions);
    if (path.endsWith('/assignments')) return envelope([ASSIGNMENT]);
    return new Response(JSON.stringify({ success: false, error: `Not stubbed: ${path}` }), { status: 501 });
};

state.course = { id: 'c1', courseName: 'CHBE 220' };
state.workspace = { permissions: { canManageRubric: true }, canvas: { mode: 'live', canImport: true } };
state.assignments = [ASSIGNMENT];

await openAssignmentPage('a1');
if (window.feather) window.feather.replace();
window.__assignmentPageReady = true;
</script>
</body>
</html>
