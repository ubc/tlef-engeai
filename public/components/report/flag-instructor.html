<div class="flag-instructor-container page-frame">
    <link rel="stylesheet" href="/styles/instructor-components/flag-instructor.css">
    <main class="main-content page-shell">
        <header class="flags-header page-header mobile-header-bar">
            <div class="header-left">
                <button id="instructor-hamburger-btn" class="instructor-mobile-hamburger-btn icon-btn" title="Open menu" aria-label="Open menu">
                    <i data-feather="menu"></i>
                </button>
                <h1 class="mobile-header-title">Flag Management</h1>
            </div>
            <div class="header-right">
                <div class="nav-tiles" role="tablist" aria-label="Flag workflow status">
                    <button type="button" class="nav-tile active" data-workflow="unresolved" aria-pressed="true" title="Unresolved">
                        <i data-feather="alert-triangle"></i>
                        <span class="count" id="unresolved-flags-count">0</span>
                    </button>
                    <button type="button" class="nav-tile" data-workflow="resolved" aria-pressed="false" title="Resolved">
                        <i data-feather="check"></i>
                        <span class="count" id="resolved-flags-count">0</span>
                    </button>
                    <button type="button" class="nav-tile" data-workflow="escalated" aria-pressed="false" title="Escalated to Admins">
                        <i data-feather="arrow-up-circle"></i>
                        <span class="count" id="escalated-flags-count">0</span>
                    </button>
                </div>
            </div>
        </header>

        <section
            class="flag-filters-panel flag-filters-panel--collapsed"
            id="flag-filters-panel"
            aria-labelledby="flag-filters-heading"
        >
            <div class="flag-filters-panel__header">
                <h2 id="flag-filters-heading">Filters</h2>
                <button
                    type="button"
                    id="flag-filter-toggle-btn"
                    class="flag-filter-toggle-btn"
                    aria-expanded="false"
                    aria-controls="flag-filters-panel-content"
                    title="Show filters"
                    aria-label="Show filters"
                >
                    <i data-feather="filter"></i>
                    <span id="flag-filter-badge" class="flag-filter-badge" hidden>0</span>
                </button>
            </div>
            <div id="flag-filters-panel-content" class="flag-filters-panel__content" hidden>
            <div class="flag-filters-panel__body">
                <fieldset class="flag-filter-fieldset flag-filter-fieldset--source">
                    <legend>Flag source</legend>
                    <label class="filter-checkbox">
                        <input type="checkbox" id="flag-source-manual" data-flag-source="manual" checked>
                        <span class="filter-text">Manual flags</span>
                    </label>
                    <label class="filter-checkbox" id="flag-source-guided-wrap">
                        <input type="checkbox" id="flag-source-guided" data-flag-source="guided-pathway" checked>
                        <span class="filter-text">Guided Pathway flags</span>
                    </label>
                </fieldset>

                <fieldset class="flag-filter-fieldset" id="flag-manual-categories-fieldset">
                    <legend>Manual categories</legend>
                    <div class="filter-checkboxes" id="flag-filter-checkboxes">
                        <label class="filter-checkbox">
                            <input type="checkbox" data-filter="innacurate_response" checked>
                            <span class="filter-text">Wrong calculations, formulas, or engineering principles</span>
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" data-filter="harassment" checked>
                            <span class="filter-text">Contains harassment, or content that violates EDI principles</span>
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" data-filter="inappropriate" checked>
                            <span class="filter-text">Non-academic discussions inappropriate for engineering education</span>
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" data-filter="dishonesty" checked>
                            <span class="filter-text">Academic dishonesty or unattributed content</span>
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" data-filter="interface bug" checked>
                            <span class="filter-text">Interface bugs or usability issues</span>
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" data-filter="other" checked>
                            <span class="filter-text">Others</span>
                        </label>
                    </div>
                </fieldset>

                <fieldset class="flag-filter-fieldset" id="flag-guided-categories-fieldset" hidden>
                    <legend>Guided Pathway categories</legend>
                    <div class="filter-checkboxes" id="flag-guided-category-checkboxes">
                        <!-- Rendered from current Pathway Library + Others -->
                    </div>
                </fieldset>

                <fieldset class="flag-filter-fieldset flag-filter-fieldset--period">
                    <legend>Period</legend>
                    <label class="flag-filter-period-label">
                        Preset
                        <select id="flag-period-preset" class="flag-filter-control">
                            <option value="all">All time</option>
                            <option value="last-7d">Last 7 days</option>
                            <option value="last-30d">Last 30 days</option>
                            <option value="this-term">This term</option>
                            <option value="custom">Custom range</option>
                        </select>
                    </label>
                    <div id="flag-period-custom" class="flag-period-custom" hidden>
                        <label class="flag-filter-period-label">
                            From
                            <input type="date" id="flag-period-from" class="flag-filter-control">
                        </label>
                        <label class="flag-filter-period-label">
                            To
                            <input type="date" id="flag-period-to" class="flag-filter-control">
                        </label>
                    </div>
                </fieldset>
            </div>
            <div class="flag-filters-panel__footer">
                <button type="button" id="flag-filter-clear-btn" class="flag-filter-clear-btn">Clear</button>
                <button type="button" id="flag-filter-apply-btn" class="flag-filter-apply-btn">Apply</button>
            </div>
            </div>
        </section>

        <p id="flag-management-status" class="flag-management-status" role="status" aria-live="polite"></p>

        <section class="flags-list" id="flags-list" aria-live="polite" aria-busy="false">
            <!-- Unified flag cards rendered by flag-management.ts -->
        </section>
    </main>
</div>
